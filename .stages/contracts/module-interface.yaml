interfaces:
  UrlNormalizer:
    exports:
      - name: normalizeUrl
        params:
          - name: rawUrl
            type: string
          - name: extraTrackingParams
            type: string[]
            optional: true
        returns: string
        description: "Canonicalize a URL: convert http to https, lowercase hostname,
          remove fragment, remove default ports (80/443), remove trailing slash
          if path length > 1, strip tracking parameters from blocklist plus
          extraTrackingParams, and sort remaining query parameters
          alphabetically by key."
      - name: TRACKING_PARAM_BLOCKLIST
        type: constant
        description: Readonly array of built-in tracking parameter names (utm_source,
          utm_medium, utm_campaign, utm_content, utm_term, gclid, fbclid,
          mc_cid, mc_eid, ref, _hsenc, _hsmi, igshid, si) to strip during
          normalization.
    imports: []
  ParagraphSegmenter:
    exports:
      - name: segmentParagraphs
        params:
          - name: text
            type: string
          - name: minChars
            type: number
        returns: string[]
        description: Split text content into paragraph segments at boundaries of 2+
          consecutive newlines, <br>, <br/>, <br />, </p>, and </div> tags.
          Discard segments shorter than minChars. Returns trimmed,
          whitespace-collapsed paragraph strings; empty array if text is empty
          or whitespace-only.
    imports: []
  Fingerprinter:
    exports:
      - name: fnv1a32
        params:
          - name: normalizedText
            type: string
        returns: number
        description: Compute a non-cryptographic FNV-1a 32-bit hash of a pre-normalized
          paragraph string. Uses FNV_OFFSET_32 (2166136261) and FNV_PRIME_32
          (16777619) with Math.imul and unsigned >>> 0 conversion.
      - name: computeFingerprintSet
        params:
          - name: content
            type: string
          - name: minChars
            type: number
        returns: Set<number>
        description: Build a deduplicated set of 32-bit paragraph fingerprints for an
          article by segmenting content into paragraphs, normalizing each,
          computing FNV-1a hashes, and collecting unique hashes.
      - name: FNV_OFFSET_32
        type: constant
        description: FNV-1a 32-bit offset basis (2166136261).
      - name: FNV_PRIME_32
        type: constant
        description: FNV-1a 32-bit prime (16777619).
    imports:
      - from: ParagraphSegmenter
        functions:
          - segmentParagraphs
  SimilarityComputer:
    exports:
      - name: jaccardSimilarity
        params:
          - name: setA
            type: Set<number>
          - name: setB
            type: Set<number>
        returns: number
        description: Compute the Jaccard similarity coefficient |A ∩ B| / |A ∪ B|
          between two fingerprint sets. Iterates over the smaller set for
          O(min(|A||B|)) intersection counting. Returns 1.0 for identical sets,
          0.0 for disjoint sets, and 0.0 if both sets are empty.
    imports: []
  ContentMerger:
    exports:
      - name: deduplicateByUrl
        params:
          - name: items
            type: FingerprintedItem[]
        returns: "{ retained: FingerprintedItem[], removed: number }"
        description: Remove exact-URL duplicates by grouping FingerprintedItems by
          normalizedUrl. Retain the highest-scoring item per group; ties broken
          by earliest originalIndex. Returns retained items and count of removed
          items.
      - name: deduplicateExactContent
        params:
          - name: items
            type: FingerprintedItem[]
        returns: "{ retained: FingerprintedItem[], removed: number }"
        description: Remove exact-content duplicates by grouping items with identical
          fingerprint sets (compared via sorted-array join). Retain
          highest-scoring item per group; ties broken by earliest originalIndex.
          Copies discarded items' source URLs into retained items' mergedSources
          arrays.
      - name: mergeNearDuplicates
        params:
          - name: items
            type: FingerprintedItem[]
          - name: threshold
            type: number
        returns: "{ retained: FingerprintedItem[], removed: number, groupsMerged: number
          }"
        description: Merge near-duplicate items using pairwise Jaccard similarity and
          union-find for transitive grouping. Compute N*(N-1)/2 pairwise
          comparisons, build edges where similarity >= threshold, form
          transitive groups via disjoint-set forest with path compression and
          union-by-rank. Per group retain highest-scoring item (ties → earliest
          originalIndex), copy discarded items' URLs into mergedSources.
    imports:
      - from: SimilarityComputer
        functions:
          - jaccardSimilarity
  Stats:
    exports:
      - name: createDedupStats
        params: []
        returns: DedupStats
        description: Create and return a new DedupStats accumulator with all count
          fields initialized to zero.
      - name: logStats
        params:
          - name: stats
            type: DedupStats
        returns: void
        description: "Log structured deduplication summary to stderr. Format: [DD]
          summary: input={inputCount}
          url_dups_removed={exactUrlDuplicatesRemoved}
          content_dups_removed={exactContentDuplicatesRemoved}
          near_dups_removed={nearDuplicatesRemoved}
          empty_removed={emptyContentRemoved} errors={errorItemsRemoved}
          output={outputCount} elapsed={elapsedMs}ms"
    imports: []
  Types:
    exports:
      - name: DedupStats
        type: schema
        description: Module-local statistics accumulator.
        fields:
          - inputCount: integer
          - emptyContentRemoved: integer
          - errorItemsRemoved: integer
          - exactUrlDuplicatesRemoved: integer
          - exactContentDuplicatesRemoved: integer
          - nearDuplicatesRemoved: integer
          - outputCount: integer
          - elapsedMs: number
      - name: FingerprintedItem
        type: schema
        description: Module-internal working structure for content-level deduplication.
        fields:
          - item: ContentItem
          - normalizedUrl: string
          - fingerprints: Set<number>
          - originalIndex: integer
      - name: MAX_PAIRWISE_ITEMS
        type: constant
        description: Maximum items (50) before pairwise comparison cost warning is
          logged to stderr.
      - name: MIN_PARAGRAPH_CHARS_DEFAULT
        type: constant
        description: Default minimum paragraph character count (20) for fingerprinting
          eligibility.
      - name: SIMILARITY_THRESHOLD_DEFAULT
        type: constant
        description: Default Jaccard similarity threshold (0.85) for near-duplicate
          classification.
    imports:
      - from: ContentItem
        functions: []
        note: Cross-module schema reference from synthesize module — ContentItem is
          consumed as-is.
  Deduplicator:
    exports:
      - name: deduplicate
        params:
          - name: items
            type: ContentItem[]
          - name: config
            type: DDConfig
            optional: true
        returns: DeduplicatedItem[]
        description: "Full deduplication pipeline entry point. Executes phases in order:
          (1) filter empty-content items with warning logging, (2) URL normalize
          each item with per-item error catching, (3) exact-URL dedup retaining
          highest score per canonical URL, (4) segment paragraphs and compute
          fingerprint sets, (5) exact-content dedup on identical fingerprint
          sets, (6) near-duplicate merge via Jaccard similarity with union-find,
          (7) assemble DeduplicatedItem[] with normalizedUrl, mergedSources, and
          fingerprintCount fields, (8) log summary stats to stderr. Returns
          empty array for empty input. Single-item input skips pairwise
          comparison. Input objects are never mutated; all outputs are fresh
          copies."
    imports:
      - from: UrlNormalizer
        functions:
          - normalizeUrl
      - from: Fingerprinter
        functions:
          - computeFingerprintSet
      - from: ContentMerger
        functions:
          - deduplicateByUrl
          - deduplicateExactContent
          - mergeNearDuplicates
      - from: Stats
        functions:
          - createDedupStats
          - logStats
  Validation:
    exports:
      - name: validateWebSearchParams
        params:
          - params: unknown
        returns: ValidationResultSuccess | ValidationResultFailure
        description: Validates raw MCP tool-call arguments for web_search against
          WebSearchInputSchema. Maps snake_case max_results to camelCase
          maxResults in WebSearchParams. Returns ValidationResultSuccess with
          WebSearchParams data on success, or ValidationResultFailure with
          human-readable message per US-MC-010.
      - name: validateWebFetchParams
        params:
          - params: unknown
        returns: ValidationResultSuccess | ValidationResultFailure
        description: Validates raw MCP tool-call arguments for web_fetch against
          WebFetchInputSchema. Validates url format as URI. Returns
          ValidationResultSuccess with WebFetchParams data on success, or
          ValidationResultFailure with message per US-MC-010.
    imports:
      - from: external:zod
        functions: []
  ToolDefinitions:
    exports:
      - name: WEB_SEARCH_TOOL
        params: []
        returns: ToolDefinition
        description: Static MCP Tool definition for web_search. Contains
          name='web_search', description, and inputSchema conforming to JSON
          Schema Draft 2020-12 with type object, required ['query'], optional
          max_results (default 5) and focus, additionalProperties false
          (US-MC-003).
      - name: WEB_FETCH_TOOL
        params: []
        returns: ToolDefinition
        description: Static MCP Tool definition for web_fetch. Contains
          name='web_fetch', description, and inputSchema conforming to JSON
          Schema Draft 2020-12 with type object, required ['url'] (format uri),
          optional focus, additionalProperties false (US-MC-004).
      - name: TOOL_DEFINITIONS
        params: []
        returns: ToolDefinition[]
        description: Array containing exactly [WEB_SEARCH_TOOL, WEB_FETCH_TOOL].
          Returned by tools/list handler in server module (US-MC-005).
    imports: []
  ToolHandlers:
    exports:
      - name: dispatchToolCall
        params:
          - name: string
          - params: unknown
          - handlers: OrchestrationHandlers
        returns: Promise<CallToolResult>
        description: Main tool-call dispatcher invoked by MCP SDK CallToolRequest
          handler. Routes to handleWebSearch or handleWebFetch based on name.
          Returns formatErrorResponse for unknown tools (US-MC-009). Fully
          enclosed in try/catch, never throws.
      - name: handleWebSearch
        params:
          - params: unknown
          - handlers: OrchestrationHandlers
        returns: Promise<CallToolResult>
        description: "Handles web_search tool calls: validates params via
          validateWebSearchParams, invokes handlers.runWebSearch, formats result
          via formatSuccessResponse. Catches timeout errors and generic errors
          per US-MC-011. Logs dispatch to stderr (US-MC-006)."
      - name: handleWebFetch
        params:
          - params: unknown
          - handlers: OrchestrationHandlers
        returns: Promise<CallToolResult>
        description: "Handles web_fetch tool calls: validates params via
          validateWebFetchParams, invokes handlers.runWebFetch, formats result
          via formatSuccessResponse. Catches timeout errors and generic errors
          per US-MC-011. Logs dispatch to stderr (US-MC-007)."
      - name: formatSuccessResponse
        params:
          - digest: string
        returns: CallToolResult
        description: "Formats successful digest string into MCP CallToolResult. Wraps in
          content array containing single TextContent {type:'text',
          text:digest}. Sets isError: false. Truncates at 25000 chars and
          appends truncation notice if exceeded (US-MC-008)."
      - name: formatErrorResponse
        params:
          - message: string
        returns: CallToolResult
        description: "Formats error message into MCP CallToolResult. Wraps in content
          array containing single TextContent {type:'text', text:message}. Sets
          isError: true. No stack traces in message (US-MC-009, US-MC-010,
          US-MC-011)."
    imports:
      - from: Validation
        functions:
          - validateWebSearchParams
          - validateWebFetchParams
  Server:
    exports:
      - name: createServer
        params:
          - options: CreateServerOptions
        returns: Server
        description: Creates and configures MCP Server instance from
          @modelcontextprotocol/sdk with ServerInfo {name, version} from
          CreateServerOptions, declares tools capability, registers tools/list
          handler returning TOOL_DEFINITIONS and tools/call handler invoking
          dispatchToolCall with options.handlers. Does NOT connect transport
          (US-MC-002, US-MC-003, US-MC-004, US-MC-005, US-MC-006, US-MC-007).
      - name: startServer
        params:
          - server: Server
        returns: Promise<void>
        description: Creates StdioServerTransport, connects to server, registers
          SIGTERM/SIGINT handlers calling shutdown, sets transport.onclose to
          exit 0 on stdin close. Logs '[mcp-server] listening on stdio' on
          connect (US-MC-001, US-MC-014).
      - name: shutdown
        params:
          - server: Server
        returns: Promise<void>
        description: "Graceful shutdown: stops accepting new requests, polls
          activeToolCalls counter every 100ms up to 5000ms grace period, closes
          transport, exits with code 0 (US-MC-014)."
    imports:
      - from: external:@modelcontextprotocol/sdk
        functions:
          - Server
          - StdioServerTransport
          - ListToolsRequestSchema
          - CallToolRequestSchema
      - from: ToolDefinitions
        functions:
          - TOOL_DEFINITIONS
      - from: ToolHandlers
        functions:
          - dispatchToolCall
      - from: shared/utils/logger
        functions:
          - log
  McpServerIndex:
    exports:
      - name: createServer
        params:
          - options: CreateServerOptions
        returns: Server
        description: Public API re-export from Server module. Creates and configures MCP
          Server with injected OrchestrationHandlers.
      - name: startServer
        params:
          - server: Server
        returns: Promise<void>
        description: Public API re-export from Server module. Starts server via
          StdioServerTransport.
      - name: shutdown
        params:
          - server: Server
        returns: Promise<void>
        description: Public API re-export from Server module. Initiates graceful
          shutdown sequence.
    imports:
      - from: Server
        functions:
          - createServer
          - startServer
          - shutdown
  ProcessEntry:
    exports:
      - name: main
        params: []
        returns: Promise<void>
        description: Process entry point (src/index.ts). Validates LLM_API_KEY env var
          (exits 1 if missing), imports appConfig for normalized env defaults,
          constructs runWebSearch and runWebFetch from pipeline-orchestration,
          injects into createServer as OrchestrationHandlers, calls startServer
          (US-MC-001, US-MC-012).
    imports:
      - from: McpServerIndex
        functions:
          - createServer
          - startServer
      - from: pipeline-orchestration
        functions:
          - runWebSearch
          - runWebFetch
      - from: shared/config
        functions:
          - appConfig
  PipelineOrchestration:
    exports:
      - name: runWebSearch
        params:
          - params: WebSearchParams
        returns: string
        description: Executes the full web_search pipeline
          (Search→Scrape→Deduplicate→Synthesize). Reads PipelineConfig, creates
          AbortController-based timeout guard, then sequentially calls SR.search
          with query and maxResults, dispatches SC.scrape concurrently up to
          maxConcurrency passing the abort signal, filters successful scrapes
          into ContentItem[], calls DD.deduplicate on the filtered items, then
          calls SY.synthesize with query, deduplicated items, and focus. Returns
          formatted digest string on success, partial, or degraded outcome.
          Throws PipelineError when search stage fails (US-PL-010), all scrapes
          fail with zero content (US-PL-011), or all results are empty/invalid.
          Throws PipelineTimeoutError when overall PIPELINE_TIMEOUT_MS elapses
          during scrape stage with no partial content. On synthesis failure,
          returns degraded fallback string with concatenated excerpts and notice
          (US-PL-008). Emits structured StageLog entries to stderr at each stage
          boundary.
      - name: runWebFetch
        params:
          - params: WebFetchParams
        returns: string
        description: Executes the web_fetch sub-flow (Scrape→Synthesize). Creates
          AbortController-based timeout guard, calls SC.scrape with the target
          URL, then calls SY.synthesizeSingle with url, title, content, and
          focus. Returns formatted digest string on success or degraded
          fallback. Throws PipelineError when scrape fails with HTTP 4xx/5xx
          (US-PL-007), DNS/connection error, or when content is empty and
          synthesis also fails (US-PL-009). Throws PipelineTimeoutError when
          overall PIPELINE_TIMEOUT_MS elapses during scrape stage. On timeout
          during synthesis with scrape completed, returns truncated scraped
          content as graceful degradation fallback instead of throwing
          (US-PL-005). On synthesis failure with content available, returns
          degraded fallback with truncated content and notice (US-PL-009).
      - name: createPipelineError
        params:
          - message: string
          - category: string
          - failedUrls: array
        returns: PipelineError
        description: Factory function constructing a PipelineError instance. category is
          one of http_error, timeout, network, parse_error, validation, config.
          failedUrls is an optional array of FailedUrl objects for diagnostic
          context. Used internally and by callers to wrap hard failures that
          should be surfaced as isError:true by MC.
      - name: createPipelineTimeoutError
        params:
          - message: string
          - timeoutMs: integer
          - failedUrls: array
        returns: PipelineTimeoutError
        description: Factory function constructing a PipelineTimeoutError instance.
          timeoutMs is the PIPELINE_TIMEOUT_MS value that was exceeded. category
          is always set to timeout. Used when overall pipeline timeout elapses
          and no partial content is available to degrade gracefully.
    imports:
      - from: SearchRetrieval
        functions:
          - search
        description: "search(query: string, options: SearchOptions):
          Promise<SearchResult[]> — retrieves SearchResult[] from SearXNG. PL
          calls this as the first stage of the web_search pipeline, passing
          query and maxResults. Returns array of SearchResult objects with
          title, url, snippet, score fields. PL checks for empty/invalid results
          and treats zero usable URLs as a search failure (US-PL-010)."
      - from: ScrapeExtract
        functions:
          - scrape
        description: "scrape(url: string, options: ScrapeOptions): Promise<ScrapeResult>
          — extracts page content from a single URL. PL calls this concurrently
          up to maxConcurrency in the web_search pipeline (passing
          ScrapeOptions.signal for abort propagation) and once in the web_fetch
          sub-flow. Returns ScrapeResult with success, url, finalUrl, title,
          textContent, extractionMethod, truncated, contentLength, elapsedMs,
          error fields. PL isolates individual failures (US-PL-006) and maps
          successful results to ContentItem objects."
      - from: Deduplicate
        functions:
          - deduplicate
        description: "deduplicate(items: ContentItem[]): Promise<ContentItem[]> —
          filters near-duplicate content items. PL calls this as the third stage
          of the web_search pipeline with the array of successfully scraped
          ContentItem objects. Returns a filtered ContentItem[] with duplicates
          removed. PL checks if all items were filtered out and returns a
          message if so (US-PL-011)."
      - from: Synthesize
        functions:
          - synthesize
          - synthesizeSingle
        description: "synthesize(query: string, contentItems: ContentItem[], focus?:
          string): Promise<DigestResult> — synthesizes a DigestResult from
          multiple deduplicated sources. PL calls this as the final stage of the
          web_search pipeline. Returns DigestResult with answer, keyPoints,
          sources fields. On failure, PL constructs degraded fallback from raw
          content (US-PL-008). synthesizeSingle(url: string, title: string,
          content: string, focus?: string): Promise<DigestResult> — synthesizes
          a DigestResult from a single page. PL calls this in the web_fetch
          sub-flow after successful scrape. On failure, PL returns truncated
          content as degraded fallback (US-PL-009)."
  Synthesizer:
    exports:
      - name: synthesize
        params:
          - query: string
          - contents: ContentItem[]
          - focus: string (optional)
        returns: Promise<DigestResult>
        description: Synthesize a structured digest from multiple deduplicated content
          items via LLM. Routes to single-call or batch-and-merge based on token
          estimate. Never rejects; all errors route to degradationFallback.
      - name: synthesizeSingle
        params:
          - url: string
          - title: string
          - content: string
          - focus: string (optional)
        returns: Promise<DigestResult>
        description: Synthesize a digest for a single known URL. Returns degradation
          result if content < 200 chars. Sources array contains exactly one
          entry.
    imports:
      - from: LLMClient
        functions:
          - createLLMClient
          - verifyLLMConnectivity
          - callLLMWithRetry
      - from: PromptBuilder
        functions:
          - buildSystemPrompt
          - buildUserPrompt
          - buildSingleSourcePrompt
      - from: TokenEstimator
        functions:
          - estimateTokens
      - from: BatchMerger
        functions:
          - batchAndMerge
      - from: ResponseParser
        functions:
          - parseDigestResponse
          - reconcileSources
      - from: DegradationHandler
        functions:
          - degradationFallback
  LLMClient:
    exports:
      - name: createLLMClient
        params:
          - config: SynthesizeConfig
        returns: OpenAIClient
        description: Instantiate an OpenAI-compatible LLM client from SynthesizeConfig.
          Validates apiKey is non-empty; throws descriptive error if missing.
      - name: verifyLLMConnectivity
        params:
          - client: OpenAIClient
        returns: Promise<boolean>
        description: Send a minimal test prompt to the LLM and return boolean indicating
          reachability.
      - name: callLLMWithRetry
        params:
          - client: OpenAIClient
          - systemPrompt: string
          - userPrompt: string
          - options: LLMCallOptions (optional)
        returns: Promise<LLMResponse>
        description: Send a chat completion request with exponential backoff retry on
          429/5xx and timeout errors. Does NOT retry on 401/403. Enforces
          AbortController timeout.
    imports: []
  PromptBuilder:
    exports:
      - name: buildSystemPrompt
        params: []
        returns: string
        description: Construct system prompt instructing LLM to produce Answer, Key
          Points, and Sources sections. Includes anti-hallucination directive
          for URLs.
      - name: buildUserPrompt
        params:
          - query: string
          - contents: ContentItem[]
          - focus: string (optional)
        returns: string
        description: Construct user prompt interleaving each content block with its
          source URL and title. Appends focus directive if provided.
      - name: buildSingleSourcePrompt
        params:
          - query: string
          - url: string
          - title: string
          - content: string
          - focus: string (optional)
        returns: string
        description: Construct user prompt for single-source synthesis, instructing LLM
          to summarize one page. Prioritizes focus aspect if provided.
      - name: buildMergePrompt
        params:
          - query: string
          - digests: DigestResult[]
          - focus: string (optional)
        returns: "{ systemPrompt: string, userPrompt: string }"
        description: Construct system and user prompts for the merge LLM call that
          combines intermediate batch digests into a single unified
          DigestResult.
    imports: []
  TokenEstimator:
    exports:
      - name: estimateTokens
        params:
          - text: string
        returns: number
        description: "Estimate token count using heuristic: ~1 token per 4 chars for
          English, ~1 token per 1.5 chars for CJK content."
    imports: []
  BatchMerger:
    exports:
      - name: batchAndMerge
        params:
          - query: string
          - contents: ContentItem[]
          - focus: string | undefined
          - client: OpenAIClient
          - config: SynthesizeConfig
        returns: Promise<DigestResult>
        description: Split content items into token-safe batches, synthesize each via
          LLM, collect intermediate digests, then merge via final merge LLM
          call. Recursively re-batches if merge prompt itself overflows.
    imports:
      - from: LLMClient
        functions:
          - callLLMWithRetry
      - from: PromptBuilder
        functions:
          - buildSystemPrompt
          - buildMergePrompt
      - from: TokenEstimator
        functions:
          - estimateTokens
      - from: ResponseParser
        functions:
          - parseDigestResponse
          - reconcileSources
      - from: DegradationHandler
        functions:
          - degradationFallback
  ResponseParser:
    exports:
      - name: parseDigestResponse
        params:
          - rawResponse: string
          - knownSources: SourceRef[]
        returns: DigestResult
        description: "Parse LLM free-text response into structured DigestResult.
          Multi-strategy: first attempts markdown headers (## Answer/Key
          Points/Sources), falls back to heuristic keyword proximity. Extracts
          URLs via regex and pairs with nearest title."
      - name: reconcileSources
        params:
          - parsed: DigestResult
          - knownSources: SourceRef[]
        returns: DigestResult
        description: Append any input source URLs missing from the LLM's Sources section
          to the parsed DigestResult, ensuring all referenced URLs are
          represented.
    imports: []
  DegradationHandler:
    exports:
      - name: degradationFallback
        params:
          - query: string
          - contents: ContentItem[]
          - reason: string
        returns: DigestResult
        description: Construct a structurally valid DigestResult from raw input content
          without calling LLM. Answer is truncated concatenation (max 2000
          chars) prefixed with availability note. KeyPoints are first sentences
          of each item (max 10). Sources include all input URLs and titles.
    imports: []
