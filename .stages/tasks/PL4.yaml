acceptanceCriteria:
  - executeWebSearchPipeline sequentially calls SR.search, then SC.scrape
    concurrently (capped at maxConcurrency), then DD.deduplicate, then
    SY.synthesize
  - Search results are passed to the scrape stage as SearchResult objects;
    successful scrapes are mapped to ContentItem objects before deduplication
  - Deduplicated ContentItem array plus original query and focus are passed to
    SY.synthesize
  - A single URL scrape failure (HTTP error, timeout, network error, or uncaught
    exception) is caught, logged to stderr with URL and error category, added to
    failedUrls, and excluded from downstream stages while remaining URLs proceed
  - When SR.search fails or returns zero usable results, a PipelineError is
    thrown with the failure reason, SearXNG URL, and remediation suggestion
  - When all candidate URLs fail to scrape (zero content), the pipeline skips
    deduplicate/synthesize and throws a PipelineError listing failed URLs and
    reasons
  - When DD.deduplicate filters out all results, a message is returned
    indicating all results were duplicates with original vs remaining counts
  - When SY.synthesize fails, a degraded fallback string is returned with
    concatenated excerpts (respecting maxContentChars per page), a notice
    prefix, and a Sources section
  - The abort signal from the timeout guard is passed to each SC.scrape call and
    checked at each stage boundary
  - Structured log lines are emitted to stderr at each stage transition with
    stage name, input/output counts, and elapsed milliseconds
  - Raw HTML from scrape results is not retained after ContentItem construction
    — only extracted text content flows forward
  - All operations are delegated to SR, SC, DD, SY modules — no direct HTTP,
    parsing, or LLM calls in this file
  - The pipeline is stateless — no shared mutable state persists between
    invocations
  - Module compiles under tsc --noEmit with strict mode enabled
schemas:
