id: PL5
title: Implement web_fetch pipeline flow
description: |
  Placeholder.
requirements:
  - US-PL-002
  - US-PL-007
  - US-PL-009
  - NFR-PL-002
  - NFR-PL-004
  - NFR-PL-008
  - DC-PL-003
acceptanceCriteria:
  - executeWebFetchPipeline calls SC.scrape(url) then SY.synthesizeSingle(url,
    title, content, focus) sequentially
  - When scrape succeeds and synthesis succeeds, the formatted digest string is
    returned
  - When scrape succeeds but page content is empty or below minimum meaningful
    length, synthesis is skipped and an informative message is returned
    indicating no meaningful content was extracted
  - When the target URL scrape fails with HTTP 4xx/5xx, a PipelineError is
    thrown including the HTTP status code, URL, and a suggested action
  - When the target URL scrape fails with a timeout, a PipelineError is thrown
    including the URL, timeout value exceeded, and suggestion to check
    connectivity or increase SCRAPE_TIMEOUT_MS
  - When the target URL is unreachable due to DNS or connection error, a
    PipelineError is thrown indicating the URL could not be reached with a
    network connectivity suggestion
  - When SY.synthesizeSingle fails and content is available, a degraded string
    with truncated content (respecting maxContentChars) and a notice prefix is
    returned
  - When content is empty AND synthesis fails, a PipelineError is thrown
    indicating both extraction and synthesis failed for the URL
  - When the overall timeout elapses during scrape, a PipelineTimeoutError is
    thrown with URL and timeout value
  - When the overall timeout elapses during synthesis (scrape completed),
    truncated scraped content is returned as graceful degradation instead of
    throwing
  - The abort signal is passed to the scrape call for cancellation support
  - Structured log lines are emitted to stderr at each stage boundary
  - Module compiles under tsc --noEmit with strict mode enabled
schemas:
  - PipelineError
  - PipelineTimeoutError
files:
  - src/modules/pipeline-orchestration/web-fetch-pipeline.ts
mode: create
dependsOn:
  - BOOTSTRAP
  - PL1
  - PL3
category: service
implementationSteps:
  - Import scrape from scrape-extract, synthesizeSingle from synthesize
  - Import TimeoutGuard from ./timeout-guard, PipelineError/PipelineTimeoutError
    and factories and formatDigest from ./orchestrator
  - "Import shared types: ScrapeResult, DigestResult, PipelineConfig, StageLog"
  - Import the stderr logger from shared/utils/logger
  - "Define executeWebFetchPipeline(url, focus, config, signal): Promise<string>"
  - "Stage 1 (scrape): Call scrape(url, { signal, timeoutMs:
    config.scrapeTimeoutMs }) in a try/catch; on success extract title and
    content from ScrapeResult; on failure map error to appropriate PipelineError
    with actionable message per US-PL-007 (HTTP status, timeout value, or
    DNS/connection suggestion); log stage"
  - Check if scraped content is empty or below a minimum threshold (e.g., < 50
    chars); if so, return informative message about no meaningful content
  - "Stage 2 (synthesize): Call synthesizeSingle(url, title, content, focus) in
    a try/catch; on success return formatDigest(result); on failure return
    degraded string with truncated content (maxContentChars) and notice prefix
    (US-PL-009)"
  - If both content is empty and synthesis fails, throw createPipelineError
    indicating both extraction and synthesis failed
  - "Handle abort: if signal.aborted is detected during scrape phase, throw
    createPipelineTimeoutError; if detected during synthesis phase (content
    available), return truncated content as degradation fallback"
  - Emit structured stage logs to stderr at scrape and synthesize boundaries
    with elapsed times
