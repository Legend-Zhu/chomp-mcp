id: README
title: Complete README (English + Chinese)
description: >-
  Review all generated code files and update both README.md and README.zh-CN.md.


  ## What to include in README.md (English version):

  1. **Project Overview** — Brief description of what the project does, key
  modules, and how they interact.

  2. **Project Structure** — Directory tree with brief annotations for each
  major directory/module.

  3. **Getting Started** — Step-by-step instructions to install dependencies,
  build, and run the project (both backend and frontend if applicable). Include
  exact commands.

  4. **API Overview** (if applicable) — List the main API endpoints with method,
  path, and brief description.

  5. **Module Overview** — Brief description of each module's responsibility and
  key files.


  ## README.zh-CN.md（中文版）需包含相同内容，用中文撰写：

  1. **项目概述** — 项目功能简介、核心模块及其交互方式。

  2. **项目结构** — 目录树，标注各主要目录/模块的用途。

  3. **快速开始** — 安装依赖、构建、运行的完整步骤和命令。

  4. **API 概览**（如适用）— 列出主要 API 端点、方法、路径和简要说明。

  5. **模块说明** — 各模块的职责和关键文件。


  For each file (README.md in English, README.zh-CN.md in Chinese):

  - **Exists with placeholder "<!-- SCDD_CODE_INSTRUCTIONS -->"**: replace the
  placeholder with project documentation. Preserve all content above it.

  - **Exists WITHOUT placeholder**: prepend the SCDD header (paradigm
  introduction, core principles, agent pipeline), then append the project
  documentation.

  - **Does NOT exist**: create it with SCDD header + project documentation.

  Always add a language switch link at the top of each file, right after the
  title (e.g. "[中文文档](./README.zh-CN.md)").
requirements: []
acceptanceCriteria:
  - Both README.md and README.zh-CN.md placeholders replaced with project
    documentation
  - Includes working build and run commands
  - Directory structure documented
  - All existing SCDD sections preserved
